at(auto-fill,minmax(125px,1fr));gap:25px 19px}.book{border:0;background:transparent;text-align:left;padding:0;min-width:0}.book:hover{background:transparent}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:2px 4px 12px #0002;background:var(--soft)}.coverplaceholder{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:Georgia,serif;font-size:15px}.booktitle{font-size:13px;font-weight:600;margin:10px 0 5px}.status{font-size:12px;color:var(--muted)}.status.owned{color:#98626d}body.dark .status.owned{color:#dfb4bb}.shade{position:fixed;inset:0;background:#0006;z-index:5}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(470px,100%);background:var(--panel);z-index:6;overflow:auto;padding:26px;box-shadow:-8px 0 30px #0002}.drawer h2{font-family:Georgia,serif;font-size:27px;font-weight:normal}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.row select{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.detailcover{width:110px;aspect-ratio:2/3;object-fit:cover;background:var(--soft)}.pill{font-size:11px;background:var(--soft);border-radius:20px;padding:5px 9px;display:inline-block;margin:3px}.auth{max-width:440px;margin:10vh auto;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.auth h1{font-family:Georgia,serif}.error{color:#b6534b;font-size:13px;white-space:pre-wrap}.hint{color:var(--muted);font-size:13px;line-height:1.5}.empty{color:var(--muted);padding:40px 0}.divider{height:1px;background:var(--line);margin:20px 0}@media(max-width:760px){.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{margin:3px 4px 10px;font-size:20px}.nav{display:flex;gap:4px;overflow-x:auto}.navbtn{white-space:nowrap;width:auto;padding:8px}.sidehead{margin:8px 4px}.collectionsnav{display:flex;overflow-x:auto;ga </style></head><body><div id="root"></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s), root=$('#root');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,session=null,books=[],collections=[],ca=[],cb=[],ce=[],selection='all',query='',statusFilter='all',drawer=null,loading=false;
let dark=localStorage.getItem('library-theme')==='dark';document.body.classList.toggle('dark',dark);
// Configuration publique : remplacer les deux valeurs ci-dessous avant publication.
// Ne jamais utiliser une cle service_role ou secret ici.
const SUPABASE_URL = 'https://bbnnlfrauitmwubxvvza.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ro2ICKncX0bAMLJlG2GzQg_TYkKTyVU';
const configured = SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY !== 'COLLER_ICI_CLE_PUBLIQUE';
const config=()=>({url:configured?SUPABASE_URL:localStorage.getItem('sb-url')||'',key:configured?SUPABASE_PUBLISHABLE_KEY:localStorage.getItem('sb-key')||''});
function setup(){const {url,key}=config();if(url&&key){try{sb=createClient(url,key);sb.auth.onAuthStateChange((_e,s)=>{session=s; if(s)refresh();else render()});sb.auth.getSession().then(({data})=>{session=data.session;if(session)refresh();else render()})}catch(e){showAuth(e.message)}}else showAuth()}
function showAuth(error=''){root.innerHTML=`<div class="auth"><h1>Ma Bibliothèque</h1><p class="hint">Votre bibliothèque privée, synchronisée entre vos appareils grâce à Supabase.</p><form id="connect" style="${configured?'display:none':''}"><label>URL du projet Supabase</label><input id="url" required placeholder="https://...supabase.co" value="${escapeHTML(config().url)}"><label>Clé publique (anon / publishable)</label><input id="key" required value="${escapeHTML(config().key)}"><button class="primary" style="margin-top:14px">Connecter</button></form><div class="divider"></div><form id="login"><label>Email</label><input id="email" type="email" required><label>Mot de passe</label><input id="password" type="password" required minlength="6"><div class="formactions"><button class="primary" name="action" value="signin">Connexion</button><button name="action" value="signup">Créer un compte</button></div></form><p class="hint">Créez d'abord les tables avec schema.sql dans Supabase. Ne renseignez jamais une clé service_role ici. Si la confirmation email est activée, validez votre adresse avant de vous connecter.</p><p class="error" id="err">${escapeHTML(error)}</p></div>`;
$('#connect').onsubmit=e=>{e.preventDefault();const url=$('#url').value.trim(),key=$('#key').value.trim();if(!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(url)){return $('#err').textContent='URL Supabase invalide'}localStorage.setItem('sb-url',url.replace(/\/$/,''));localStorage.setItem('sb-key',key);location.reload()};$('#login').onsubmit=async e=>{e.preventDefault();if(!sb)return $('#err').textContent='Connectez d’abord votre projet Supabase.';const email=$('#email').value,password=$('#password').value,signup=e.submitter?.value==='signup';const {data,error}=await (signup?sb.auth.signUp({email,password}):sb.auth.signInWithPassword({email,password}));$('#err').textContent=error?.message||(signup&&!data.session?'Compte créé : vérifiez votre email.':'');if(data.session){session=data.session;refresh()}}}
async function refresh(){if(!session)return;loading=true;render();const tables=['books','collections','collection_authors','collection_books','collection_exclusions'];const res=await Promise.all(tables.map(t=>sb.from(t).select('*')));loading=false;const err=res.find(r=>r.error);if(err){alert('Erreur de chargement : '+err.error.message);return render()}[books,collections,ca,cb,ce]=res.map(r=>r.data);render()}
function currentBooks(){return books.filter(b=>{const inCollection=selection==='all'||selection==='owned'&&b.owned||selection==='wish'&&!b.owned||selection==='reading'&&b.reading_status==='reading'||(selection.startsWith('c:')&&belongs(b,selection.slice(2)));return inCollection&&(statusFilter==='all'||statusFilter==='owned'&&b.owned||statusFilter==='wish'&&!b.owned)&&(`${b.title} ${b.author}`).toLocaleLowerCase('fr').includes(query.toLocaleLowerCase('fr'))})}
function belongs(b,cid){return !ce.some(x=>x.book_id===b.id&&x.collection_id===cid)&&(cb.some(x=>x.book_id===b.id&&x.collection_id===cid)||ca.some(x=>x.collection_id===cid&&x.author.toLocaleLowerCase('fr').trim()===b.author.toLocaleLowerCase('fr').trim()))}
const titleOf=()=>({all:'Tous les ouvrages',owned:'Livres possédés',wish:'Liste de souhaits',reading:'Lectures en cours'})[selection]||collections.find(c=>'c:'+c.id===selection)?.name||'Collection';
function cover(b){return b.cover_url?`<img class="cover" loading="lazy" alt="Couverture de ${escapeHTML(b.title)}" src="${escapeHTML(b.cover_url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cover coverplaceholder" style="display:none">${escapeHTML(b.title)}</div>`:`<div class="cover coverplaceholder">${escapeHTML(b.title)}</div>`}
function render(){if(!session){showAuth();return}const filtered=currentBooks(),authors=[...new Set(filtered.map(b=>b.author))].sort((a,b)=>a.localeCompare(b,'fr'));root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">Ma Bibliothèque</div><div class="nav">${[['all','Tous les ouvrages'],['owned','Possédés'],['wish','Souhaits'],['reading','En cours']].map(([id,t])=>`<button class="navbtn ${selection===id?'active':''}" data-nav="${id}">${t}</button>`).join('')}</div><div class="sidehead"><span class="small">COLLECTIONS</span><button data-action="newcollection" title="Nouvelle collection">＋</button></div><div class="collectionsnav">${collections.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(c=>`<button class="navbtn ${selection==='c:'+c.id?'active':''}" data-nav="c:${c.id}">▧ ${escapeHTML(c.name)}</button>`).join('')}</div></aside><main class="main"><div class="top"><h1>${escapeHTML(titleOf())}</h1><div class="topactions"><button data-action="theme" title="Mode jour / nuit">${dark?'☀':'☾'}</button><button class="primary" data-action="add">＋ Ajouter</button><button data-action="logout" title="Déconnexion">↪</button></div></div><p class="small">${filtered.length} ouvrage(s) · ${authors.length} auteur(s) ${loading?'· Chargement…':''}</p><div class="toolbar"><input id="search" placeholder="Rechercher titre ou auteur…" value="${escapeHTML(query)}"><select id="statusfilter"><option value="all">Tous les statuts</option><option value="owned" ${statusFilter==='owned'?'selected':''}>Possédés</option><option value="wish" ${statusFilter==='wish'?'selected':''}>À acquérir</option></select>${selection.startsWith('c:')?'<button data-action="managecollection">Gérer la collection</button>':''}</div>${authors.map(a=>`<section><h2 class="author">${escapeHTML(a)}</h2><div class="shelf">${filtered.filter(b=>b.author===a).sort((x,y)=>x.title.localeCompare(y.title,'fr')).map(b=>`<button class="book" data-book="${b.id}">${cover(b)}<div class="booktitle">${escapeHTML(b.title)}</div><div class="status ${b.owned?'owned':''}">${b.owned?'✓ Possédé':'○ À acquérir'}</div></button>`).join('')}</div></section>`).join('')||'<div class="empty">Aucun ouvrage ici. Utilisez « Ajouter » pour commencer.</div>'}</main></div>${drawer?`<div class="shade" data-action="close"></div><aside class="drawer" id="drawer"></aside>`:''}`;
root.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{selection=el.dataset.nav;render()});root.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>{drawer={type:'book',id:el.dataset.book};render()});root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));$('#search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#statusfilter').onchange=e=>{statusFilter=e.target.value;render()};if(drawer)renderDrawer()}
function action(a){if(a==='theme'){dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('library-theme',dark?'dark':'light');render()}if(a==='logout')sb.auth.signOut();if(a==='close'){drawer=null;render()}if(a==='add'){drawer={type:'add'};render()}if(a==='newcollection'){drawer={type:'newcollection'};render()}if(a==='managecollection'){drawer={type:'managecollection',id:selection.slice(2)};render()}}
function renderDrawer(){const el=$('#drawer');if(!el)return;let content='';if(drawer.type==='add'||drawer.type==='book'){const b=drawer.type==='book'?books.find(x=>x.id===drawer.id):null;if(!b&&drawer.type==='book'){drawer=null;render();return}content=`<h2>${b?'Fiche de l’ouvrage':'Ajouter un ouvrage'}</h2><form id="bookform"><div class="formgrid">${!b?`<div class="full"><label>ISBN (facultatif)</label><div class="row"><input id="isbnlookup" inputmode="numeric" placeholder="9782353671281"><button type="button" id="isbnsearch" class="primary">Rechercher</button></div><p class="hint" id="isbnmsg">Une seule fiche sera proposée. La couverture doit correspondre exactement à cet ISBN.</p></div>`:""}<div class="full"><label>Titre</label><input name="title" required value="${escapeHTML(b?.title||'')}" placeholder="Titre de l’ouvrage"></div><div class="full"><label>Auteur</label><input name="author" required value="${escapeHTML(b?.author||'')}" placeholder="Prénom Nom"></div><div class="full"><button type="button" id="searchcatalog">Rechercher automatiquement la couverture</button><p class="small" id="lookupmsg">Recherche facultative par titre et auteur. Choisissez le résultat correspondant à votre livre.</p><div id="catalogresults"></div></div><div class="full"><label>Couverture (URL de l’image)</label><input name="cover_url" type="url" value="${escapeHTML(b?.cover_url||'')}" placeholder="https://..."></div><div><label>Possession</label><select name="owned"><option value="false" ${!b?.owned?'selected':''}>À acquérir</option><option value="true" ${b?.owned?'selected':''}>Possédé</option></select></div><div><label>Lecture</label><select name="reading_status">${[['unread','À lire'],['reading','En cours'],['finished','Terminé'],['abandoned','Abandonné']].map(([v,t])=>`<option value="${v}" ${b?.reading_status===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="formactions"><button class="primary" type="submit">${b?'Enregistrer':'Ajouter le livre'}</button>${b?'<button type="button" id="deletebook">Supprimer</button>':''}</div><p id="formmsg" class="error"></p></form>${b?`<div class="divider"></div><h3>Collections personnelles</h3><p class="hint">Un ouvrage peut appartenir à une collection individuellement ou via son auteur.</p>${collections.map(c=>`<label class="row"><input style="width:auto" type="checkbox" data-membership="${c.id}" ${belongs(b,c.id)?'checked':''}> ${escapeHTML(c.name)} ${ca.some(x=>x.collection_id===c.id&&x.author.toLowerCase()===b.author.toLowerCase())?'(via auteur)':''}</label>`).join('')}`:''}`;
}else if(drawer.type==='newcollection'){content=`<h2>Nouvelle collection</h2><form id="collectionform"><label>Nom</label><input name="name" required placeholder="Marxisme classique"><div class="formactions"><button class="primary">Créer</button></div><p class="error" id="formmsg"></p></form>`}else if(drawer.type==='managecollection'){const c=collections.find(x=>x.id===drawer.id);content=`<h2>${escapeHTML(c?.name||'Collection')}</h2><h3>Ajouter un auteur</h3><p class="hint">Seuls les livres enregistrés de cet auteur apparaissent, y compris ceux ajoutés plus tard.</p><form id="authorform"><select name="author">${[...new Set(books.map(b=>b.author))].sort().filter(a=>!ca.some(x=>x.collection_id===c.id&&x.author===a)).map(a=>`<option value="${escapeHTML(a)}">${escapeHTML(a)}</option>`).join('')}</select><button style="margin-top:8px">Ajouter l'auteur</button></form><h3>Auteurs associés</h3>${ca.filter(x=>x.collection_id===c.id).map(x=>`<div class="row"><span style="flex:1">${escapeHTML(x.author)}</span><button data-removeauthor="${x.id}">Retirer</button></div>`).join('')||'<p class="small">Aucun auteur associé.</p>'}<div class="divider"></div><h3>Ajouter un ouvrage précis</h3><form id="memberform"><select name="book_id">${books.filter(b=>!belongs(b,c.id)).map(b=>`<option value="${b.id}">${escapeHTML(b.author)} — ${escapeHTML(b.title)}</option>`).join('')}</select><button style="margin-top:8px">Ajouter l'ouvrage</button></form><div class="divider"></div><button id="deletecollection">Supprimer cette collection</button><p class="error" id="formmsg"></p>`}
el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="small">MA BIBLIOTHÈQUE</span><button id="close">✕</button></div>${content}`;$('#close').onclick=()=>action('close');if($('#bookform')){const form=$('#bookform');form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.author=normalizeAuthor(d.author);d.owned=d.owned==='true';if(!d.cover_url)d.cover_url=null;if(drawer.type==='add'&&form.dataset.isbn)d.isbn=form.dataset.isbn;const res=drawer.type==='book'?await sb.from('books').update(d).eq('id',drawer.id):await sb.from('books').insert(d);if(res.error)return $('#formmsg').textContent=res.error.message;drawer=null;await refresh()};if($('#isbnsearch'))$('#isbnsearch').onclick=async()=>{const isbn=normalizedISBN($('#isbnlookup').value),msg=$('#isbnmsg'),btn=$('#isbnsearch');if(!validISBN(isbn)){msg.textContent='ISBN-10 ou ISBN-13 invalide (vérifiez les chiffres).';return}btn.disabled=true;msg.textContent='Recherche de l’édition exacte dans plusieurs catalogues…';$('#catalogresults').innerHTML='';try{const result=await resolveExactISBN(isbn);if(!result?.title){msg.textContent='ISBN non résolu. Vous pouvez renseigner le titre et l’auteur manuellement.';return}form.elements.title.value=result.title;form.elements.author.value=normalizeAuthor(result.author||'');form.elements.cover_url.value=result.cover_url||'';form.dataset.isbn=isbn;msg.textContent=(result.cover_url?'Couverture correspondant à cet ISBN trouvée.':'Titre identifié, mais aucune couverture de cette édition vérifiée : image laissée vide.')+(result.author?'':' Auteur à compléter.')+(result.note?' '+result.note:'');}catch(e){msg.textContent='Recherche indisponible : '+e.message}finally{btn.disabled=false}};const fillMetadata=metadata=>{if(metadata.title)form.elements.title.value=metadata.title;if(metadata.author)form.elements.author.value=normalizeAuthor(metadata.author);if(metadata.cover_url)form.elements.cover_url.value=metadata.cover_url;$('#lookupmsg').textContent=metadata.cover_url?'Couverture récupérée : vérifiez-la avant d’enregistrer.':'Notice trouvée sans couverture : vous pouvez renseigner une URL manuellement.'};$('#searchcatalog').onclick=async()=>{const title=form.elements.title.value.trim(),author=form.elements.author.value.trim();if(!title&&!author){$('#lookupmsg').textContent='Saisissez d’abord le titre ou l’auteur.';return}$('#lookupmsg').textContent='Recherche dans les catalogues…';$('#catalogresults').innerHTML='';try{const results=await lookupByTitle(title,author);if(!results.length)throw Error('Aucun résultat. Essayez un titre plus court.');showCatalogResults(results,fillMetadata);$('#lookupmsg').textContent=results.length+' résultat(s) : sélectionnez une couverture correspondant à votre livre.'}catch(e){$('#lookupmsg').textContent=e.message}};if($('#deletebook'))$('#deletebook').onclick=async()=>{if(confirm('Supprimer cet ouvrage ?')){const r=await sb.from('books').delete().eq('id',drawer.id);if(r.error)return alert(r.error.message);drawer=null;refresh()}};el.querySelectorAll('[data-membership]').forEach(input=>input.onchange=async()=>{const cid=input.dataset.membership,b=books.find(x=>x.id===drawer.id),via=ca.some(x=>x.collection_id===cid&&x.author.toLowerCase()===b.author.toLowerCase());let res;if(input.checked){await sb.from('collection_exclusions').delete().eq('collection_id',cid).eq('book_id',b.id);res=await sb.from('collection_books').upsert({collection_id:cid,book_id:b.id},{onConflict:'collection_id,book_id'})}else{await sb.from('collection_books').delete().eq('collection_id',cid).eq('book_id',b.id);if(via)res=await sb.from('collection_exclusions').upsert({collection_id:cid,book_id:b.id},{onConflict:'collection_id,book_id'})}if(res?.error)alert(res.error.message);await refresh()})}
if($('#collectionform'))$('#collectionform').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();const r=await sb.from('collections').insert({name}).select().single();if(r.error)return $('#formmsg').textContent=r.error.message;selection='c:'+r.data.id;drawer=null;refresh()};if($('#authorform'))$('#authorform').onsubmit=async e=>{e.preventDefault();const author=new FormData(e.target).get('author');if(!author)return;const r=await sb.from('collection_authors').insert({collection_id:drawer.id,author});if(r.error)return alert(r.error.message);refresh()};if($('#memberform'))$('#memberform').onsubmit=async e=>{e.preventDefault();const book_id=new FormData(e.target).get('book_id');if(!book_id)return;await sb.from('collection_exclusions').delete().eq('collection_id',drawer.id).eq('book_id',book_id);const r=await sb.from('collection_books').upsert({collection_id:drawer.id,book_id},{onConflict:'collection_id,book_id'});if(r.error)return alert(r.error.message);refresh()};el.querySelectorAll('[data-removeauthor]').forEach(x=>x.onclick=async()=>{const r=await sb.from('collection_authors').delete().eq('id',x.dataset.removeauthor);if(r.error)alert(r.error.message);refresh()});if($('#deletecollection'))$('#deletecollection').onclick=async()=>{if(!confirm('Supprimer cette collection ? Les livres seront conservés.'))return;const r=await sb.from('collections').delete().eq('id',drawer.id);if(r.error)return alert(r.error.message);selection='all';drawer=null;refresh()}}
// Sources publiques : Google Books et Open Library. Les notices peuvent être incomplètes.
async function jsonFetch(url){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(url,{signal:controller.signal});return r.ok?await r.json():null}finally{clearTimeout(timer)}}catch{return null}}

// Corrige uniquement les formats bibliographiques non ambigus ("Nom, Prénom").
function normalizeAuthor(value){
 return String(value||'').split(/\s*;\s*/).map(part=>{
  const m=part.trim().match(/^([^,]+),\s*([^,]+)$/);
  if(!m)return part.trim();
  const family=m[1].trim(),given=m[2].trim();
  if(!family||!given||/\d/.test(family+given))return part.trim();
  return `${given} ${family}`;
 }).join('; ');
}

function googleResult(v){const x=v.volumeInfo||{};const ids=x.industryIdentifiers||[];return {title:x.title||'',author:normalizeAuthor((x.authors||[]).join(', ')),publisher:x.publisher||'',publication_year:x.publishedDate||'',pages:x.pageCount||null,isbn:(ids.find(i=>i.type==='ISBN_13')||ids.find(i=>i.type==='ISBN_10')||{}).identifier||'',cover_url:(x.imageLinks?.thumbnail||x.imageLinks?.smallThumbnail||'').replace(/^http:/,'https:'),source:'Google Books'}}
function olSearchResult(d){const isbn=d.isbn?.[0]||'';return {title:d.title||'',author:normalizeAuthor((d.author_name||[]).slice(0,3).join(', ')),publisher:d.publisher?.[0]||'',publication_year:d.first_publish_year||'',pages:d.number_of_pages_median||null,isbn,cover_url:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:(isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`:''),source:'Open Library (œuvre : édition à vérifier)'}}
async function openLibraryEdition(isbn){const o=await jsonFetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json');if(!o)return null;let author='';if(o.authors?.length){const people=await Promise.all(o.authors.slice(0,4).map(a=>jsonFetch('https://openlibrary.org'+a.key+'.json')));author=people.map(x=>x?.name).filter(Boolean).join(', ')}return {title:o.title||'',author:normalizeAuthor(author),publisher:o.publishers?.[0]||'',publication_year:o.publish_date||'',pages:o.number_of_pages||null,isbn,cover_url:o.covers?.[0]?`https://covers.openlibrary.org/b/id/${o.covers[0]}-L.jpg`:`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`,source:'Open Library (édition ISBN)'}}
function normalizedISBN(x){return String(x||'').replace(/[^0-9X]/gi,'').toUpperCase()}
function uniqueResults(items){const seen=new Set();return items.filter(x=>{if(!x?.title)return false;const k=[normalizedISBN(x.isbn),x.title.toLowerCase().replace(/[^\p{L}\p{N}]/gu,''),String(x.publisher||'').toLowerCase(),String(x.publication_year||'').slice(0,4)].join('|');if(seen.has(k))return false;seen.add(k);return true}).slice(0,60)}
let catalogWarnings=[];
async function bnfLookup(mode, params){
 if(!sb){catalogWarnings.push('BnF : Supabase non connecté');return []}
 try{const {data,error}=await sb.functions.invoke('bnf-search',{body:{mode,...params}});
  if(error){catalogWarnings.push('BnF : '+(error.message||'fonction indisponible'));return []}
  if(data?.error)catalogWarnings.push('BnF : '+data.error);if(data?.warning)catalogWarnings.push('BnF : '+data.warning);
  if(!Array.isArray(data?.results))return [];
  return data.results.map(x=>({...x,author:normalizeAuthor(x.author),source:'BnF · Catalogue général'}));
 }catch(e){catalogWarnings.push('BnF : '+e.message);return []}
}
// Notice de secours renseignée manuellement pour un ISBN de test ; ne prouve pas la disponibilité d’une édition dans les catalogues.
const ISBN_FALLBACK={
 '9782353671281':{title:'Ludwig Feuerbach et la fin de la philosophie allemande classique',author:'Friedrich Engels',publisher:'Les Éditions sociales'}
};
async function lookupISBN(isbn){
 if(!/^(?:\d{10}|\d{13}|\d{9}X)$/.test(isbn))throw Error('ISBN invalide : 10 ou 13 caractères attendus.');
 catalogWarnings=[];
 const [g,o,bnf,g2]=await Promise.all([
  jsonFetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)+'&maxResults=20'),
  openLibraryEdition(isbn),bnfLookup('isbn',{isbn}),
  jsonFetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(isbn)+'&maxResults=20')]);
 const results=uniqueResults([...bnf,o,...(g?.items||[]).map(googleResult),...(g2?.items||[]).map(googleResult)].filter(Boolean));
 // Do not assign the queried ISBN to unrelated editions.
 return results.sort((a,b)=>Number(normalizedISBN(b.isbn)===isbn)-Number(normalizedISBN(a.isbn)===isbn));
}

// Check digits, not just length. ISBN-10 X is accepted only as the last character.
function validISBN(value){const s=normalizedISBN(value);if(/^\d{13}$/.test(s)){let n=0;for(let i=0;i<13;i++)n+=Number(s[i])*(i%2?3:1);return n%10===0}if(/^\d{9}[\dX]$/.test(s)){let n=0;for(let i=0;i<10;i++)n+=(10-i)*(s[i]==='X'?10:Number(s[i]));return n%11===0}return false}
function isbnEquivalent(a,b){a=normalizedISBN(a);b=normalizedISBN(b);if(a===b)return true;const to13=s=>{if(!/^\d{9}[\dX]$/.test(s))return s;const base='978'+s.slice(0,9);let sum=0;for(let i=0;i<12;i++)sum+=Number(base[i])*(i%2?3:1);return base+((10-sum%10)%10)};return to13(a)===to13(b)}
async function imageExists(url){if(!url)return false;return new Promise(resolve=>{const img=new Image();let done=false;const finish=x=>{if(!done){done=true;resolve(x)}};img.onload=()=>finish(img.naturalWidth>1&&img.naturalHeight>1);img.onerror=()=>finish(false);img.src=url;setTimeout(()=>finish(false),5000)})}
async function resolveExactISBN(isbn){
 catalogWarnings=[];
 const [g,o,bnf,g2]=await Promise.all([
  jsonFetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)+'&maxResults=20'),
  openLibraryEdition(isbn),bnfLookup('isbn',{isbn}),
  jsonFetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(isbn)+'&maxResults=20')
 ]);
 const google=[...(g?.items||[]),...(g2?.items||[])].map(googleResult);
 const exact=[...google,...bnf,o].filter(x=>x?.title&&isbnEquivalent(x.isbn,isbn));
 const fallback=ISBN_FALLBACK[isbn];
 // If the ISBN itself is missing from catalogues, use the known title only as an explicit fallback.
 let metadata=exact.find(x=>x.author)||exact[0]||null;
 if(!metadata&&fallback)metadata={...fallback,isbn,source:'Notice de secours locale'};
 if(!metadata)return null;
 // Never use a cover returned by a work-level search or by an unmatched edition.
 // Google Books imageLinks belong to an ISBN-matched volume; Open Library edition cover is ISBN-specific.
 const candidates=[...exact.filter(x=>x.cover_url).map(x=>x.cover_url),
  'https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(isbn)+'-L.jpg?default=false'];
 let cover='';for(const url of [...new Set(candidates)]){if(await imageExists(url)){cover=url;break}}
 return {title:metadata.title,author:metadata.author||fallback?.author||'',cover_url:cover,note:!exact.length?'Notice de secours : édition non confirmée dans les catalogues.':''};
}
async function lookupByTitle(title,author){
 catalogWarnings=[];
 const q=[title?'intitle:'+title:'',author?'inauthor:'+author:''].filter(Boolean).join(' ');
 const ol=new URLSearchParams({limit:'30',fields:'key,title,author_name,publisher,first_publish_year,number_of_pages_median,isbn,cover_i'});
 if(title)ol.set('title',title);if(author)ol.set('author',author);
 const [g,o,bnf]=await Promise.all([
 jsonFetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books'),
 jsonFetch('https://openlibrary.org/search.json?'+ol.toString()),bnfLookup('title',{title,author})]);
 return uniqueResults([...bnf,...(g?.items||[]).map(googleResult),...(o?.docs||[]).map(olSearchResult)]);
}
function showCatalogResults(results,fill){const host=$('#catalogresults');host.innerHTML='';results.forEach((book,i)=>{const btn=document.createElement('button');btn.type='button';btn.style.cssText='display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:7px 0;padding:8px';const cover=document.createElement('div');if(book.cover_url){const img=document.createElement('img');img.src=book.cover_url;img.alt='';img.loading='lazy';img.style.cssText='width:43px;height:64px;object-fit:cover';cover.append(img)}const desc=document.createElement('div');const strong=document.createElement('strong');strong.textContent=book.title;const sub=document.createElement('div');sub.className='small';sub.textContent=[book.author,book.publisher,book.publication_year,book.isbn,book.source].filter(Boolean).join(' · ');desc.append(strong,sub);btn.append(cover,desc);btn.onclick=()=>{fill(book);host.innerHTML=''};host.append(btn)})}

setup();
