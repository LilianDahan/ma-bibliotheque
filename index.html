<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f4ef"><title>Ma Bibliothèque</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23713f49%22%2F%3E%3Cpath%20d%3D%22M32%2019c-7-5-15-5-22-3v29c8-2%2015-1%2022%204%207-5%2014-6%2022-4V16c-7-2-15-2-22%203Zm0%200v30%22%20fill%3D%22none%22%20stroke%3D%22%23fff7ec%22%20stroke-width%3D%223.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:light;--bg:#f8f4ef;--panel:#fffdfa;--text:#29252a;--muted:#82757a;--line:#e8ddd9;--accent:#713f49;--soft:#f1e6e4}body.dark{color-scheme:dark;--bg:#201b22;--panel:#2d2630;--text:#f3eae8;--muted:#c0adb6;--line:#493c47;--accent:#dfb4bb;--soft:#40323d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:10px 12px}button:hover{background:var(--soft)}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}input,textarea,select{width:100%}textarea{min-height:95px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px 15px;background:var(--panel);border-right:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:24px;margin:5px 8px 35px}.navbtn{display:block;text-align:left;width:100%;border:0;background:transparent;padding:12px;margin:3px 0}.navbtn.active{background:var(--soft);font-weight:700}.small{font-size:12px;color:var(--muted)}.sidehead{display:flex;justify-content:space-between;align-items:center;margin:30px 8px 10px}.sidehead button{padding:4px 9px}.main{min-width:0;padding:28px clamp(16px,4vw,58px)}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.topactions{display:flex;gap:8px}.top h1{font-family:Georgia,serif;font-weight:normal;font-size:33px;margin:0}.toolbar{display:flex;gap:12px;margin:25px 0;flex-wrap:wrap}.toolbar input{max-width:360px}.toolbar select{max-width:185px}.author{font-family:Georgia,serif;font-size:24px;font-weight:normal;border-bottom:1px solid var(--line);padding-bottom:12px;margin:32px 0 18px}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:25px 19px}.book{border:0;background:transparent;text-align:left;padding:0;min-width:0}.book:hover{background:transparent}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:2px 4px 12px #0002;background:var(--soft)}.coverplaceholder{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:Georgia,serif;font-size:15px}.booktitle{font-size:13px;font-weight:600;margin:10px 0 5px}.status{font-size:12px;color:var(--muted)}.status.owned{color:#98626d}body.dark .status.owned{color:#dfb4bb}.shade{position:fixed;inset:0;background:#0006;z-index:5}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(470px,100%);background:var(--panel);z-index:6;overflow:auto;padding:26px;box-shadow:-8px 0 30px #0002}.drawer h2{font-family:Georgia,serif;font-size:27px;font-weight:normal}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.row select{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.detailcover{width:110px;aspect-ratio:2/3;object-fit:cover;background:var(--soft)}.pill{font-size:11px;background:var(--soft);border-radius:20px;padding:5px 9px;display:inline-block;margin:3px}.auth{max-width:440px;margin:10vh auto;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.auth h1{font-family:Georgia,serif}.error{color:#b6534b;font-size:13px;white-space:pre-wrap}.hint{color:var(--muted);font-size:13px;line-height:1.5}.empty{color:var(--muted);padding:40px 0}.divider{height:1px;background:var(--line);margin:20px 0}@media(max-width:760px){.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{margin:3px 4px 10px;font-size:20px}.nav{display:flex;gap:4px;overflow-x:auto}.navbtn{white-space:nowrap;width:auto;padding:8px}.sidehead{margin:8px 4px}.collectionsnav{display:flex;overflow-x:auto;gap:4px}.main{padding:20px 15px}.top h1{font-size:26px}.shelf{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:18px 12px}.drawer{padding:18px}.formgrid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s), root=$('#root');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,session=null,books=[],collections=[],ca=[],cb=[],ce=[],selection='all',query='',statusFilter='all',drawer=null,loading=false;
let dark=localStorage.getItem('library-theme')==='dark';document.body.classList.toggle('dark',dark);
// Configuration publique : remplacer les deux valeurs ci-dessous avant publication.
// Ne jamais utiliser une cle service_role ou secret ici.
const SUPABASE_URL = 'https://bbnnlfrauitmwubxvvza.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ro2ICKncX0bAMLJlG2GzQg_TYkKTyVU';
const configured = SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY !== 'COLLER_ICI_CLE_PUBLIQUE';
const config=()=>({url:configured?SUPABASE_URL:localStorage.getItem('sb-url')||'',key:configured?SUPABASE_PUBLISHABLE_KEY:localStorage.getItem('sb-key')||''});
function setup(){const {url,key}=config();if(url&&key){try{sb=createClient(url,key);sb.auth.onAuthStateChange((_e,s)=>{session=s; if(s)refresh();else render()});sb.auth.getSession().then(({data})=>{session=data.session;if(session)refresh();else render()})}catch(e){showAuth(e.message)}}else showAuth()}
function showAuth(error=''){root.innerHTML=`<div class="auth"><h1>Ma Bibliothèque</h1><p class="hint">Votre bibliothèque privée, synchronisée entre vos appareils grâce à Supabase.</p><form id="connect" style="${configured?'display:none':''}"><label>URL du projet Supabase</label><input id="url" required placeholder="https://...supabase.co" value="${escapeHTML(config().url)}"><label>Clé publique (anon / publishable)</label><input id="key" required value="${escapeHTML(config().key)}"><button class="primary" style="margin-top:14px">Connecter</button></form><div class="divider"></div><form id="login"><label>Email</label><input id="email" type="email" required><label>Mot de passe</label><input id="password" type="password" required minlength="6"><div class="formactions"><button class="primary" name="action" value="signin">Connexion</button><button name="action" value="signup">Créer un compte</button></div></form><p class="hint">Créez d'abord les tables avec schema.sql dans Supabase. Ne renseignez jamais une clé service_role ici. Si la confirmation email est activée, validez votre adresse avant de vous connecter.</p><p class="error" id="err">${escapeHTML(error)}</p></div>`;
$('#connect').onsubmit=e=>{e.preventDefault();const url=$('#url').value.trim(),key=$('#key').value.trim();if(!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(url)){return $('#err').textContent='URL Supabase invalide'}localStorage.setItem('sb-url',url.replace(/\/$/,''));localStorage.setItem('sb-key',key);location.reload()};$('#login').onsubmit=async e=>{e.preventDefault();if(!sb)return $('#err').textContent='Connectez d’abord votre projet Supabase.';const email=$('#email').value,password=$('#password').value,signup=e.submitter?.value==='signup';const {data,error}=await (signup?sb.auth.signUp({email,password}):sb.auth.signInWithPassword({email,password}));$('#err').textContent=error?.message||(signup&&!data.session?'Compte créé : vérifiez votre email.':'');if(data.session){session=data.session;refresh()}}}
async function refresh(){if(!session)return;loading=true;render();const tables=['books','collections','collection_authors','collection_books','collection_exclusions'];const res=await Promise.all(tables.map(t=>sb.from(t).select('*')));loading=false;const err=res.find(r=>r.error);if(err){alert('Erreur de chargement : '+err.error.message);return render()}[books,collections,ca,cb,ce]=res.map(r=>r.data);render()}
function currentBooks(){return books.filter(b=>{const inCollection=selection==='all'||selection==='owned'&&b.owned||selection==='wish'&&!b.owned||selection==='reading'&&b.reading_status==='reading'||(selection.startsWith('c:')&&belongs(b,selection.slice(2)));return inCollection&&(statusFilter==='all'||statusFilter==='owned'&&b.owned||statusFilter==='wish'&&!b.owned)&&(`${b.title} ${b.author}`).toLocaleLowerCase('fr').includes(query.toLocaleLowerCase('fr'))})}
function belongs(b,cid){return !ce.some(x=>x.book_id===b.id&&x.collection_id===cid)&&(cb.some(x=>x.book_id===b.id&&x.collection_id===cid)||ca.some(x=>x.collection_id===cid&&x.author.toLocaleLowerCase('fr').trim()===b.author.toLocaleLowerCase('fr').trim()))}
const titleOf=()=>({all:'Tous les ouvrages',owned:'Livres possédés',wish:'Liste de souhaits',reading:'Lectures en cours'})[selection]||collections.find(c=>'c:'+c.id===selection)?.name||'Collection';
function cover(b){return b.cover_url?`<img class="cover" loading="lazy" alt="Couverture de ${escapeHTML(b.title)}" src="${escapeHTML(b.cover_url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cover coverplaceholder" style="display:none">${escapeHTML(b.title)}</div>`:`<div class="cover coverplaceholder">${escapeHTML(b.title)}</div>`}
function render(){if(!session){showAuth();return}const filtered=currentBooks(),authors=[...new Set(filtered.map(b=>b.author))].sort((a,b)=>a.localeCompare(b,'fr'));root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">Ma Bibliothèque</div><div class="nav">${[['all','Tous les ouvrages'],['owned','Possédés'],['wish','Souhaits'],['reading','En cours']].map(([id,t])=>`<button class="navbtn ${selection===id?'active':''}" data-nav="${id}">${t}</button>`).join('')}</div><div class="sidehead"><span class="small">COLLECTIONS</span><button data-action="newcollection" title="Nouvelle collection">＋</button></div><div class="collectionsnav">${collections.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(c=>`<button class="navbtn ${selection==='c:'+c.id?'active':''}" data-nav="c:${c.id}">▧ ${escapeHTML(c.name)}</button>`).join('')}</div></aside><main class="main"><div class="top"><h1>${escapeHTML(titleOf())}</h1><div class="topactions"><button data-action="theme" title="Mode jour / nuit">${dark?'☀':'☾'}</button><button class="primary" data-action="add">＋ Ajouter</button><button data-action="logout" title="Déconnexion">↪</button></div></div><p class="small">${filtered.length} ouvrage(s) · ${authors.length} auteur(s) ${loading?'· Chargement…':''}</p><div class="toolbar"><input id="search" placeholder="Rechercher titre ou auteur…" value="${escapeHTML(query)}"><select id="statusfilter"><option value="all">Tous les statuts</option><option value="owned" ${statusFilter==='owned'?'selected':''}>Possédés</option><option value="wish" ${statusFilter==='wish'?'selected':''}>À acquérir</option></select>${selection.startsWith('c:')?'<button data-action="managecollection">Gérer la collection</button>':''}</div>${authors.map(a=>`<section><h2 class="author">${escapeHTML(a)}</h2><div class="shelf">${filtered.filter(b=>b.author===a).sort((x,y)=>x.title.localeCompare(y.title,'fr')).map(b=>`<button class="book" data-book="${b.id}">${cover(b)}<div class="booktitle">${escapeHTML(b.title)}</div><div class="status ${b.owned?'owned':''}">${b.owned?'✓ Possédé':'○ À acquérir'}</div></button>`).join('')}</div></section>`).join('')||'<div class="empty">Aucun ouvrage ici. Utilisez « Ajouter » pour commencer.</div>'}</main></div>${drawer?`<div class="shade" data-action="close"></div><aside class="drawer" id="drawer"></aside>`:''}`;
root.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{selection=el.dataset.nav;render()});root.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>{drawer={type:'book',id:el.dataset.book};render()});root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));$('#search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#statusfilter').onchange=e=>{statusFilter=e.target.value;render()};if(drawer)renderDrawer()}
function action(a){if(a==='theme'){dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('library-theme',dark?'dark':'light');render()}if(a==='logout')sb.auth.signOut();if(a==='close'){drawer=null;render()}if(a==='add'){drawer={type:'add'};render()}if(a==='newcollection'){drawer={type:'newcollection'};render()}if(a==='managecollection'){drawer={type:'managecollection',id:selection.slice(2)};render()}}
function renderDrawer(){const el=$('#drawer');if(!el)return;let content='';if(drawer.type==='add'||drawer.type==='book'){const b=drawer.type==='book'?books.find(x=>x.id===drawer.id):null;if(!b&&drawer.type==='book'){drawer=null;render();return}content=`<h2>${b?'Fiche de l’ouvrage':'Ajouter un ouvrage'}</h2>${b?`<div class="row">${b.cover_url?`<img class="detailcover" src="${escapeHTML(b.cover_url)}">`:''}<div><strong>${escapeHTML(b.title)}</strong><p class="small">${escapeHTML(b.author)}</p></div></div>`:''}<form id="bookform"><div class="formgrid"><div class="full"><label>ISBN (optionnel)</label><div class="row"><input name="isbn" id="isbn" value="${escapeHTML(b?.isbn||'')}" placeholder="ISBN-13"><button type="button" id="lookup">Rechercher</button></div><div id="lookupmsg" class="small"></div></div>${[['title','Titre'],['author','Auteur'],['publisher','Éditeur'],['imprint','Collection éditoriale'],['publication_year','Année de l’édition'],['translator','Traducteur'],['pages','Nombre de pages'],['cover_url','URL de couverture']].map(([key,label])=>`<div class="${['title','author','cover_url'].includes(key)?'full':''}"><label>${label}</label><input name="${key}" ${['title','author'].includes(key)?'required':''} ${key==='pages'?'type="number" min="1"':''} value="${escapeHTML(b?.[key]||'')}"></div>`).join('')}<div><label>Possession</label><select name="owned"><option value="false" ${!b?.owned?'selected':''}>À acquérir</option><option value="true" ${b?.owned?'selected':''}>Possédé</option></select></div><div><label>Lecture</label><select name="reading_status">${[['unread','À lire'],['reading','En cours'],['finished','Terminé'],['abandoned','Abandonné']].map(([v,t])=>`<option value="${v}" ${b?.reading_status===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="full"><label>Notes personnelles</label><textarea name="notes">${escapeHTML(b?.notes||'')}</textarea></div></div><div class="formactions"><button class="primary" type="submit">${b?'Enregistrer':'Ajouter le livre'}</button>${b?'<button type="button" id="deletebook">Supprimer</button>':''}</div><p id="formmsg" class="error"></p></form>${b?`<div class="divider"></div><h3>Collections personnelles</h3><p class="hint">Un ouvrage peut appartenir à une collection individuellement ou via son auteur.</p>${collections.map(c=>`<label class="row"><input style="width:auto" type="checkbox" data-membership="${c.id}" ${belongs(b,c.id)?'checked':''}> ${escapeHTML(c.name)} ${ca.some(x=>x.collection_id===c.id&&x.author.toLowerCase()===b.author.toLowerCase())?'(via auteur)':''}</label>`).join('')}`:''}`;
}else if(drawer.type==='newcollection'){content=`<h2>Nouvelle collection</h2><form id="collectionform"><label>Nom</label><input name="name" required placeholder="Marxisme classique"><div class="formactions"><button class="primary">Créer</button></div><p class="error" id="formmsg"></p></form>`}else if(drawer.type==='managecollection'){const c=collections.find(x=>x.id===drawer.id);content=`<h2>${escapeHTML(c?.name||'Collection')}</h2><h3>Ajouter un auteur</h3><p class="hint">Seuls les livres enregistrés de cet auteur apparaissent, y compris ceux ajoutés plus tard.</p><form id="authorform"><select name="author">${[...new Set(books.map(b=>b.author))].sort().filter(a=>!ca.some(x=>x.collection_id===c.id&&x.author===a)).map(a=>`<option value="${escapeHTML(a)}">${escapeHTML(a)}</option>`).join('')}</select><button style="margin-top:8px">Ajouter l'auteur</button></form><h3>Auteurs associés</h3>${ca.filter(x=>x.collection_id===c.id).map(x=>`<div class="row"><span style="flex:1">${escapeHTML(x.author)}</span><button data-removeauthor="${x.id}">Retirer</button></div>`).join('')||'<p class="small">Aucun auteur associé.</p>'}<div class="divider"></div><h3>Ajouter un ouvrage précis</h3><form id="memberform"><select name="book_id">${books.filter(b=>!belongs(b,c.id)).map(b=>`<option value="${b.id}">${escapeHTML(b.author)} — ${escapeHTML(b.title)}</option>`).join('')}</select><button style="margin-top:8px">Ajouter l'ouvrage</button></form><div class="divider"></div><button id="deletecollection">Supprimer cette collection</button><p class="error" id="formmsg"></p>`}
el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="small">MA BIBLIOTHÈQUE</span><button id="close">✕</button></div>${content}`;$('#close').onclick=()=>action('close');if($('#bookform')){const form=$('#bookform');form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.owned=d.owned==='true';d.pages=d.pages?Number(d.pages):null;Object.keys(d).forEach(k=>{if(d[k]==='')d[k]=null});const res=drawer.type==='book'?await sb.from('books').update(d).eq('id',drawer.id):await sb.from('books').insert(d);if(res.error)return $('#formmsg').textContent=res.error.message;drawer=null;await refresh()};$('#lookup').onclick=async()=>{const isbn=$('#isbn').value.replace(/[^0-9X]/gi,'');$('#lookupmsg').textContent='Recherche en cours…';try{const metadata=await lookupISBN(isbn);if(!metadata)throw Error('Aucune fiche trouvée pour cet ISBN. Saisie manuelle possible.');for(const [k,v] of Object.entries(metadata)){if(form.elements[k]&&v!=null)form.elements[k].value=v}$('#lookupmsg').textContent='Métadonnées trouvées : vérifiez bien l’édition avant d’enregistrer.'}catch(e){$('#lookupmsg').textContent=e.message}};if($('#deletebook'))$('#deletebook').onclick=async()=>{if(confirm('Supprimer cet ouvrage ?')){const r=await sb.from('books').delete().eq('id',drawer.id);if(r.error)return alert(r.error.message);drawer=null;refresh()}};el.querySelectorAll('[data-membership]').forEach(input=>input.onchange=async()=>{const cid=input.dataset.membership,b=books.find(x=>x.id===drawer.id),via=ca.some(x=>x.collection_id===cid&&x.author.toLowerCase()===b.author.toLowerCase());let res;if(input.checked){await sb.from('collection_exclusions').delete().eq('collection_id',cid).eq('book_id',b.id);res=await sb.from('collection_books').upsert({collection_id:cid,book_id:b.id},{onConflict:'collection_id,book_id'})}else{await sb.from('collection_books').delete().eq('collection_id',cid).eq('book_id',b.id);if(via)res=await sb.from('collection_exclusions').upsert({collection_id:cid,book_id:b.id},{onConflict:'collection_id,book_id'})}if(res?.error)alert(res.error.message);await refresh()})}
if($('#collectionform'))$('#collectionform').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();const r=await sb.from('collections').insert({name}).select().single();if(r.error)return $('#formmsg').textContent=r.error.message;selection='c:'+r.data.id;drawer=null;refresh()};if($('#authorform'))$('#authorform').onsubmit=async e=>{e.preventDefault();const author=new FormData(e.target).get('author');if(!author)return;const r=await sb.from('collection_authors').insert({collection_id:drawer.id,author});if(r.error)return alert(r.error.message);refresh()};if($('#memberform'))$('#memberform').onsubmit=async e=>{e.preventDefault();const book_id=new FormData(e.target).get('book_id');if(!book_id)return;await sb.from('collection_exclusions').delete().eq('collection_id',drawer.id).eq('book_id',book_id);const r=await sb.from('collection_books').upsert({collection_id:drawer.id,book_id},{onConflict:'collection_id,book_id'});if(r.error)return alert(r.error.message);refresh()};el.querySelectorAll('[data-removeauthor]').forEach(x=>x.onclick=async()=>{const r=await sb.from('collection_authors').delete().eq('id',x.dataset.removeauthor);if(r.error)alert(r.error.message);refresh()});if($('#deletecollection'))$('#deletecollection').onclick=async()=>{if(!confirm('Supprimer cette collection ? Les livres seront conservés.'))return;const r=await sb.from('collections').delete().eq('id',drawer.id);if(r.error)return alert(r.error.message);selection='all';drawer=null;refresh()}}
async function lookupISBN(isbn){if(!/^(?:\d{10}|\d{13}|\d{9}X)$/.test(isbn))throw Error('ISBN invalide : 10 ou 13 caractères attendus.');const g=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)).then(r=>r.ok?r.json():null).catch(()=>null);const item=g?.items?.[0]?.volumeInfo;if(item){return {title:item.title,author:item.authors?.join(', '),publisher:item.publisher,publication_year:item.publishedDate, pages:item.pageCount,cover_url:item.imageLinks?.thumbnail?.replace(/^http:/,'https:')}}const o=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json').then(r=>r.ok?r.json():null).catch(()=>null);if(!o)return null;let author='';if(o.authors?.length){const names=await Promise.all(o.authors.slice(0,5).map(a=>fetch('https://openlibrary.org'+a.key+'.json').then(r=>r.ok?r.json():null).catch(()=>null)));author=names.map(a=>a?.name).filter(Boolean).join(', ')}return {title:o.title,author,publisher:o.publishers?.[0],publication_year:o.publish_date,pages:o.number_of_pages,cover_url:o.covers?.[0]?`https://covers.openlibrary.org/b/id/${o.covers[0]}-L.jpg`:null}}
setup();
</script></body></html>
